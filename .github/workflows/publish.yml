name: Publish to pub.dev

# Triggered on:
#   1. push to main  → tag job creates a version tag if pubspec.yaml bumped
#   2. tag push      → publish job runs (dart_ci.yml already tested this commit)
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  # ── Auto-tag when version is bumped on main ──────────────────────────────
  # No Flutter or Dart needed — just bash + git.
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.RELEASE_PAT }}

      - name: Tag if version bumped
        run: |
          NEW=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | tr -d ' ')
          OLD=$(git show HEAD~1:pubspec.yaml 2>/dev/null | grep '^version:' | sed 's/version: *//' | tr -d ' ' || echo "")
          if [ -z "$NEW" ] || [ "$NEW" = "$OLD" ] || git rev-parse "v$NEW" >/dev/null 2>&1; then
            echo "Nothing to tag (version unchanged or tag already exists)"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$NEW" -m "Release v$NEW"
          git push origin "v$NEW"

  # ── Publish via the official dart-lang reusable workflow ─────────────────
  # dart_ci.yml already ran analyze + test on the commit that created this tag,
  # so there is nothing to repeat here.
  # The reusable workflow installs standalone Dart only (~20 s) — no Flutter.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
